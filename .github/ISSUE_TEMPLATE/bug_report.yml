name: Bug report
description: Something broken in the alpha app
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security issues, do **not** use this form — see [SECURITY.md](https://github.com/heron982/chaincord/blob/master/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected vs what you got
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From package.json / About / installer name (e.g. 0.1.15)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Optional. Redact invites and keys.
